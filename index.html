<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-ANIME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:white;padding:15px}
h1{font-size:28px;text-align:center;margin:10px 0}
h1 span{color:#ff2d55}
.search{width:100%;padding:12px;border-radius:10px;border:none;background:#222;color:white;margin:10px 0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.card-info{padding:10px}
.card-info b{font-size:15px}
.card-info p{font-size:12px;color:#aaa;margin-top:4px}
#detail{display:none;position:fixed;inset:0;background:#0a0a0a;z-index:99;overflow-y:auto;padding:15px}
#detail img{width:100%;height:280px;object-fit:cover;border-radius:12px}
.btn{padding:12px 18px;background:#ff2d55;border:none;color:white;border-radius:10px;margin:5px;cursor:pointer;font-size:15px}
.epBtn{background:#222;width:100%;text-align:left;padding:13px;border-radius:10px;border:none;color:white;margin:6px 0;cursor:pointer}
iframe{width:100%;height:220px;border-radius:12px;border:none;margin-top:10px;background:#000}
.back{position:sticky;top:0;background:#0a0a0a;padding:5px 0;z-index:10}
</style>
</head>
<body>

<h1>V-<span>ANIME</span></h1>
<input class="search" id="search" placeholder="Search Anime..." oninput="filterAnime()">
<div class="grid" id="grid"><p style="text-align:center;width:100%;grid-column:span 2">Loading... Sheet se Anime aa rahe hai...</p></div>

<div id="detail"></div>

<script>
// ============ YAHAN APNI SHEET KA LINK DALNA HAI ============
// Sheet ko Publish karne ke baad jo CSV link milega wo yahan paste karna
const ANIME_SHEET_URL = "YAHAN_ANIME_SHEET_CSV_LINK_DALO";
const EPISODE_SHEET_URL = "YAHAN_EPISODE_SHEET_CSV_LINK_DALO";
// ============================================================

let allAnime = [];
let allEpisodes = [];

function csvToArray(csv){
  let rows = csv.split("\n").map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g,'').trim()));
  let header = rows[0];
  return rows.slice(1).filter(r=>r[0]).map(r=>{
    let o={}; header.forEach((h,i)=>o[h]=r[i]||""); return o;
  });
}

async function load(){
  try{
    let a = await fetch(ANIME_SHEET_URL).then(r=>r.text());
    let e = await fetch(EPISODE_SHEET_URL).then(r=>r.text());
    allAnime = csvToArray(a);
    allEpisodes = csvToArray(e);
    showAnime(allAnime);
  }catch(err){
    document.getElementById("grid").innerHTML = "<p>Sheet Link Galat Hai! Neeche wale step se link dobara dalo.</p>";
  }
}

function getYoutubeId(url){
  if(!url) return "";
  let m = url.match(/(?:youtube\.com\/.*v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([^&?\/\s]+)/);
  return m ? m[1] : "";
}

function showAnime(list){
  let grid = document.getElementById("grid");
  if(list.length==0){ grid.innerHTML="<p>Koi Anime Nahi Mila. Sheet me Anime Add Karo.</p>"; return; }
  grid.innerHTML = list.map((a,i)=>{
    let idx = allAnime.indexOf(a);
    return `<div class="card" onclick="openDetail(${idx})">
      <img src="${a.Poster}" onerror="this.src='https://via.placeholder.com/300x400?text='+encodeURIComponent(a.Name)">
      <div class="card-info"><b>${a.Name}</b><p>${a.Type}</p></div>
    </div>`;
  }).join("");
}

function filterAnime(){
  let q = document.getElementById("search").value.toLowerCase();
  showAnime(allAnime.filter(a=>a.Name.toLowerCase().includes(q)));
}

function openDetail(idx){
  let a = allAnime[idx];
  let eps = allEpisodes.filter(e=>e.Anime.toLowerCase().trim()===a.Name.toLowerCase().trim());
  let trailerId = getYoutubeId(a.Trailer);
  let trailerEmbed = trailerId ? `<iframe src="https://www.youtube.com/embed/${trailerId}" allowfullscreen></iframe>` : `<p>Trailer Nahi Hai</p>`;
  let epHtml = eps.length ? eps.map(ep=>{
    let vidId = getYoutubeId(ep.Link);
    let playLink = vidId ? `https://www.youtube.com/embed/${vidId}` : ep.Link;
    return `<button class="epBtn" onclick="playVideo('${playLink}')">▶ Episode ${ep.Episode}</button>`;
  }).join("") : "<p>Abhi Episode Add Nahi Hue Hai.</p>";

  document.getElementById("detail").innerHTML = `
    <div class="back"><button class="btn" onclick="closeDetail()">← Back</button></div>
    <img src="${a.Poster}">
    <h2 style="margin:10px 0">${a.Name} <span style="font-size:13px;color:#aaa">(${a.Type})</span></h2>
    <h3>🎬 Trailer</h3>
    ${trailerEmbed}
    <div id="player"></div>
    <h3 style="margin-top:15px">📺 Episodes</h3>
    ${epHtml}
  `;
  document.getElementById("detail").style.display="block";
  window.scrollTo(0,0);
}

function playVideo(link){
  document.getElementById("player").innerHTML = `<h3 style="margin-top:15px">▶ Now Playing</h3><iframe src="${link}" allowfullscreen></iframe>`;
  document.getElementById("player").scrollIntoView();
}

function closeDetail(){ document.getElementById("detail").style.display="none"; }

load();
</script>
</body>
</html>
