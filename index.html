body{background:#0a0a0f;color:#fff}
header{position:sticky;top:0;z-index:99;background:#0a0a0f;padding:12px 14px;display:flex;align-items:center;gap:10px}

.hero{text-align:center;padding:20px 14px 6px}
.hero-logo{width:130px;height:130px;border-radius:50%;border:3px solid #a855f7;object-fit:cover;box-shadow:0 0 35px #a855f7;margin:0 auto}

.hero p{color:#aaa;margin-top:8px;font-size:14px}
.trending{padding:14px}
.trending h2{font-size:24px;margin-bottom:12px}
#animeList{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151d;border-radius:16px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:220px;object-fit:cover;display:block;background:#222}
.card-body{padding:12px}
.card-body h3{font-size:17px;line-height:1.2}
.card-body p{font-size:13px;color:#aaa;margin:5px 0 10px}
.watch-btn{width:100%;padding:10px;background:#a855f7;color:#fff;border:none;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer}
.detail{background:#0a0a0f;padding:10px;display:none}
.detail.show{display:block}
.season-bar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.season-bar button{padding:6px 12px;border-radius:20px;border:1px solid #444;background:#222;color:#fff;font-size:12px}
.season-bar button.active{background:#fff;color:#000;font-weight:700}
.ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ep-grid button{padding:9px 0;background:#2a2a2a;border:1px solid #333;color:#fff;border-radius:8px;font-size:12px}
.ep-grid button.active{border:2px solid #a855f7 !important}
.player{margin:10px 0;border-radius:10px;overflow:hidden;background:#000}
.player iframe{width:100%;height:220px;border:none;display:block}
.player-msg{padding:12px;text-align:center;font-size:12px;color:#aaa}
.direct-box{background:#222;padding:10px;border-radius:10px;font-size:12px;line-height:1.6}
.direct-box a{display:block;text-align:center;background:#a855f7;color:#fff;padding:11px;border-radius:8px;text-decoration:none;font-weight:700;margin:8px 0}
.req{margin:14px;background:#15151d;padding:12px;border-radius:12px;border:1px solid #333}
.req input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#0a0a0f;color:#fff}
.req button{width:100%;padding:11px;background:#a855f7;color:#fff;border:none;border-radius:8px;font-weight:700}
.footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>

let currentSeason={}; let currentEp={};
function render(list){
let html="";
list.forEach(a=>{
let sIdx=currentSeason[a.id]||0; let season=a.seasons[sIdx];
let epBtns=""; for(let i=1;i<=Math.min(season.episodes,24);i++){let act=(currentEp[a.id]===i)?'active':''; epBtns+=`<button class="${act}" onclick="playEp(${a.id},${i},this,'${a.title}',${sIdx})">Ep ${i}</button>`;}
let playerHtml="";
if(a.type==="youtube"){ playerHtml=`<div class="player" id="player-${a.id}"><div class="player-msg">▶ Watch Now > Ep dabao - Video yahi andar chalega</div><iframe id="frame-${a.id}" style="display:none" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`; }
else{ playerHtml=`<div class="direct-box"><b>${a.title} - Direct Watch</b><br>${a.steps}<a href="${a.link}" target="_blank">Watch on ${a.platform} ➜</a></div>`; }
let seasonBtns=a.seasons.map((s,idx)=>`<button class="${idx===sIdx?'active':''}" onclick="changeSeason(${a.id},${idx})">${s.name}</button>`).join("");
html+=`<div class="card"><img src="${a.poster}" onerror="this.src='https://placehold.co/300x400/222/fff?text=${encodeURIComponent(a.title)}'"><div class="card-body"><h3>${a.title}</h3><p>${a.genre}</p><button class="watch-btn" onclick="toggleDetail(${a.id},this)">▶ Watch Now</button><div class="detail" id="d-${a.id}"><div style="font-size:12px;color:#bbb;margin-top:8px">${a.desc}</div>${playerHtml}<div class="season-bar">${seasonBtns}</div><div class="ep-grid">${epBtns}</div></div></div></div>`;
});
document.getElementById("animeList").innerHTML=html;
}
function toggleDetail(id,btn){let d=document.getElementById('d-'+id);d.classList.toggle('show');}
function changeSeason(id,idx){currentSeason[id]=idx;currentEp[id]=0;render(animes);}
function playEp(id,ep,btn,title,sIdx){
currentEp[id]=ep;
let card=btn.closest('.card');
card.querySelectorAll('.ep-grid button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
let frame=document.getElementById('frame-'+id);
if(frame){
frame.style.display='block';
let q=encodeURIComponent(title+" Episode "+ep+" Hindi Dub Trailer");
frame.src="https://www.youtube.com/embed?listType=search&list="+q+"&autoplay=1";
}
}
function searchAnime(){let q=document.getElementById("searchInput").value.toLowerCase();let f=animes.filter(a=>a.title.toLowerCase().includes(q));render(f);}
function submitRequest(){let n=document.getElementById("reqName").value;let l=document.getElementById("reqLang").value;if(!n)return alert("Anime ka naam likho");document.getElementById("reqMsg").innerText=`Request Saved: ${n} - ${l} ✅ Hum jald add karenge!`;document.getElementById("reqName").value="";document.getElementById("reqLang").value="";}
render(animes);
</script>
