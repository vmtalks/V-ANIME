*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0f;color:#fff}
header{position:sticky;top:0;z-index:99;background:#0a0a0f;padding:10px 12px;display:flex;align-items:center;gap:10px}
.logo-img{width:48px;height:48px;border-radius:50%;border:2px solid #a855f7;object-fit:cover;box-shadow:0 0 15px #a855f7;background:#000}

#searchInput{flex:1;padding:10px 14px;border-radius:20px;border:none;background:#1e1e26;color:#fff;outline:none;min-width:0}

.hero-logo{width:130px;height:130px;border-radius:50%;border:3px solid #a855f7;object-fit:cover;box-shadow:0 0 35px #a855f7;background:#000}

.trending{padding:14px}.trending h2{font-size:24px;margin-bottom:12px}
#animeList{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151d;border-radius:16px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:220px;object-fit:cover;display:block;background:#222}
.card-body{padding:12px}.card-body h3{font-size:17px;line-height:1.2;min-height:40px}
.card-body p{font-size:13px;color:#aaa;margin:5px 0 10px}
.watch-btn{width:100%;padding:10px;background:#a855f7;color:#fff;border:none;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer}
#detailPage{display:none;padding:12px}
.back-btn{background:#222;color:#fff;padding:9px 16px;border-radius:20px;border:none;font-size:14px;cursor:pointer}
.d-top{display:flex;gap:14px;margin:14px 0}.d-top img{width:120px;height:170px;border-radius:12px;object-fit:cover;background:#222}
.d-top h2{font-size:22px;line-height:1.2}.d-top p{color:#a855f7;font-size:13px;margin:6px 0}
.player{margin:10px 0;border-radius:12px;overflow:hidden;background:#000}.player iframe{width:100%;height:230px;border:none;display:block}
.player-msg{padding:12px;text-align:center;font-size:12px;color:#aaa}
.now-playing{background:#1e1e1e;padding:10px;border-radius:10px;font-size:14px;margin-bottom:10px;display:none}.now-playing b{color:#a855f7}

.footer{text-align:center;color:#777;font-size:12px;padding:20px}

function render(list){
let html="";
list.forEach(a=>{
html+=`<div class="card"><img src="${a.poster}" onerror="this.onerror=null;this.src='https://placehold.co/300x400/1a1a22/fff?text=${encodeURIComponent(a.title.slice(0,20))}'"><div class="card-body"><h3>${a.title}</h3><p>${a.genre}</p><button class="watch-btn" onclick="openDetail(${a.id})">▶ Watch Now</button></div></div>`;
});
document.getElementById("animeList").innerHTML=html;
}
function openDetail(id){
let a=animes.find(x=>x.id===id);
document.getElementById("homePage").style.display="none";document.getElementById("detailPage").style.display="block";
document.getElementById("dTitle").innerText=a.id+". "+a.title;document.getElementById("dLang").innerText=a.genre;document.getElementById("dDesc").innerText="Tap karo, yahi chalega! • "+a.genre;document.getElementById("dPoster").src=a.poster;document.getElementById("dPoster").onerror=function(){this.src="https://placehold.co/300x400/1a1a22/fff?text="+encodeURIComponent(a.title.slice(0,20))};
document.getElementById("nowPlaying").style.display="none";
let epHtml="<h3 style='margin:10px 0'>Episodes</h3><div class='ep-grid'>";
for(let i=1;i<=Math.min(a.eps,24);i++){epHtml+=`<button id="epBtn${i}" onclick="playEp(${a.id},${i})">Ep ${i}</button>`;}
epHtml+="</div>";document.getElementById("epWrap").innerHTML=epHtml;
if(a.type==="direct"){document.getElementById("playerWrap").innerHTML="";document.getElementById("directWrap").innerHTML=`<div class="direct-box"><b>${a.title} - Direct Watch</b><br>Official Link pe Hindi Dub me dekho<a href="${a.link}" target="_blank">Watch on ${a.platform} ➜</a></div>`;}
else{document.getElementById("directWrap").innerHTML="";document.getElementById("playerWrap").innerHTML=`<div class="player"><div class="player-msg">▶ Ep dabao - Video yahi andar chalega</div><iframe id="mainPlayer" style="display:none" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;}
window.scrollTo(0,0);
}
function goBack(){document.getElementById("detailPage").style.display="none";document.getElementById("homePage").style.display="block";let f=document.getElementById("mainPlayer");if(f)f.src="";window.scrollTo(0,0);}
function playEp(id,ep){
let a=animes.find(x=>x.id===id);
document.querySelectorAll('.ep-grid button').forEach(b=>b.classList.remove('active'));let btn=document.getElementById("epBtn"+ep);if(btn)btn.classList.add('active');
document.getElementById("nowPlaying").style.display="block";document.getElementById("nowText").innerText=a.title+" - Episode "+ep;
let frame=document.getElementById("mainPlayer");if(!frame)return;frame.style.display="block";
if(a.type==="single"){frame.src="https://www.youtube.com/embed/"+a.pl+"?autoplay=1";}else{frame.src="https://www.youtube.com/embed?listType=playlist&list="+a.pl+"&index="+ep+"&autoplay=1&rel=0";}
frame.scrollIntoView({behavior:"smooth"});
}
function searchAnime(){let q=document.getElementById("searchInput").value.toLowerCase();let f=animes.filter(a=>a.title.toLowerCase().includes(q));render(f);}
function submitRequest(){let n=document.getElementById("reqName").value;let l=document.getElementById("reqLang").value;if(!n)return alert("Anime ka naam likho");document.getElementById("reqMsg").innerText=`Request Saved: ${n} - ${l} ✅`;document.getElementById("reqName").value="";document.getElementById("reqLang").value="";}
render(animes);
</script>
