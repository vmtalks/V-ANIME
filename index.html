
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V ANIME</title>
<style>
body{background:#0f0f0f;color:white;font-family:sans-serif;margin:0;padding:15px}
h1{color:#ff2d55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:#1e1e1e;border-radius:15px;overflow:hidden;text-align:center;padding-bottom:10px}
.poster{height:220px;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:bold}
.sl{background:linear-gradient(135deg,#4a00e0,#8e2de2)}
.jjk{background:linear-gradient(135deg,#c33764,#1d2671)}
button{background:#ff2d55;color:white;border:none;padding:10px 20px;border-radius:20px;font-size:16px}
</style>
</head>
<body>
<h1>V ANIME 🔥</h1>
<button>+ Upload</button>
<br><br>
<div class="grid">
  <div class="card">
    <div class="poster sl">SL</div>
    <h3>Solo Leveling</h3>
    <p>Ep 1 - Hindi Dub</p>
  </div>
  <div class="card">
    <div class="poster jjk">JJK</div>
    <h3>Jujutsu Kaisen</h3>
    <p>Ep 1 - Hindi Dub</p>
  </div>
</div>
</body>
</html>
