<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V ANIME</title>
<style>
body{background:#0f0f0f;color:white;font-family:sans-serif;margin:0;padding:15px}
h1{color:#ff2d55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:#1e1e1e;border-radius:15px;overflow:hidden;text-align:center;padding-bottom:10px}
.card img{width:100%;height:260px;object-fit:cover;display:block}
button{background:#ff2d55;color:white;border:none;padding:10px 20px;border-radius:20px;font-size:16px}
</style>
</head>
<body>
<h1>V ANIME 🔥</h1>
<button>+ Upload</button>
<br><br>
<div class="grid">
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/en/9/92/Solo_Leveling_Volume_1_Cover.jpg">
    <h3>Solo Leveling</h3>
    <p>Ep 1 - Hindi Dub</p>
  </div>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/en/4/46/Jujutsu_kaisen.jpg">
    <h3>Jujutsu Kaisen</h3>
    <p>Ep 1 - Hindi Dub</p>
  </div>
</div>
</body>
</html>
