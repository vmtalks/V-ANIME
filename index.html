<title>V-ANIME - Hindi Dub Anime</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;padding:15px}
.top{text-align:center;margin:10px 0 15px}
.top h1{color:#ff4757;font-size:32px}
.top p{color:#aaa;font-size:13px;margin-top:4px}
#search{width:100%;padding:13px;border-radius:10px;border:none;background:#222;color:#fff;font-size:16px;margin-bottom:15px;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#1e1e1e;border-radius:12px;overflow:hidden;text-decoration:none;color:#fff;display:block}
.card img{width:100%;height:230px;object-fit:cover;display:block;background:#333}
.card b{display:block;padding:9px 8px 2px;font-size:14px;line-height:1.2}
.card p{padding:0 8px 10px;color:#ff4757;font-size:12px}
.footer{text-align:center;color:#666;font-size:12px;margin:25px 0 10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}.card img{height:260px}}
</style></head><body>

<div class="top">
<h1>🔥 V-ANIME</h1>
<p>50 Anime • Hindi Dub • Free</p>
</div>

<input id="search" placeholder="Search karo... Naruto, Solo Leveling, Mushoku..." onkeyup="filter()">

function render(list){
