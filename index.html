.card{background:#16161c;border-radius:12px;overflow:hidden;border:1px solid #222;padding-bottom:10px}

.lang{font-size:12px;color:#4da6ff;margin:5px 0}
.desc{font-size:12px;color:#bbb;line-height:1.45}

.season-bar button.active{background:#fff;color:#000;font-weight:700}
.ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ep-grid button{padding:9px 0;background:#2a2a2a;border:1px solid #333;color:#fff;border-radius:8px;font-size:12px}
.ep-grid button.active{border:2px solid #2b7cff !important}
.player{margin:10px 0;border-radius:10px;overflow:hidden;background:#000;padding:12px;text-align:center;font-size:12px;color:#aaa}
.direct-box{background:#222;padding:10px;border-radius:10px;font-size:12px;line-height:1.6}
.direct-box a{display:block;text-align:center;background:#e50914;color:#fff;padding:11px;border-radius:8px;text-decoration:none;font-weight:700;margin:8px 0}

.rate button.on{color:#ffcc00}
.comment-box input{width:100%;padding:9px;border-radius:8px;border:1px solid #333;background:#0b0b0f;color:#fff}
.comment-list div{background:#0b0b0f;padding:6px;border-radius:6px;margin-top:4px;font-size:12px}
.footer{text-align:center;color:#777;font-size:12px;padding:20px}

let currentSeason={}; let currentEp={};
function render(list){
let html="";
list.forEach(a=>{
let sIdx=currentSeason[a.id]||0; let season=a.seasons[sIdx];
let epBtns=""; for(let i=1;i<=Math.min(season.episodes,24);i++){let act=(currentEp[a.id]===i)?'active':''; epBtns+=`<button class="${act}" onclick="playEp(${a.id},${i},this,'${a.title}')">Ep ${i}</button>`;}
let playerHtml="";
if(a.type==="youtube"){ playerHtml=`<div class="player">▶ Episode dabao - Official Site pe khulega<br><span style="font-size:11px">Ab koi Rick Astley / Fake Trailer nahi hai</span></div>`; }
else{ playerHtml=`<div class="direct-box"><b>${a.title} - Direct Watch</b><br>${a.steps}<a href="${a.link}" target="_blank">Watch on ${a.platform} ➜</a></div>`; }
let seasonBtns=a.seasons.map((s,idx)=>`<button class="${idx===sIdx?'active':''}" onclick="changeSeason(${a.id},${idx})">${s.name}</button>`).join("");
html+=`<div class="card"><img src="${a.poster}"><div class="card-body"><h3>${a.title}</h3><div class="lang">${a.lang}</div><div class="desc">${a.desc}</div>${playerHtml}<div class="season-bar">${seasonBtns}</div><div class="ep-grid">${epBtns}</div><div class="rate" id="rate-${a.id}">${[1,2,3,4,5].map(n=>`<button onclick="rateAnime(${a.id},${n})">★</button>`).join("")} <span style="font-size:12px;color:#aaa">Rate karo</span></div><div class="comment-box"><input placeholder="Comment likho..." onkeydown="if(event.key==='Enter') addComment(${a.id},this)"><div class="comment-list" id="c-${a.id}"></div></div></div></div>`;
});
document.getElementById("animeList").innerHTML=html;
}
function changeSeason(id,idx){currentSeason[id]=idx;currentEp[id]=0;render(animes);}
function playEp(id,ep,btn,title){currentEp[id]=ep;let card=btn.closest('.card');card.querySelectorAll('.ep-grid button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');window.open("https://www.crunchyroll.com/search?q="+encodeURIComponent(title),"_blank");}
function searchAnime(){let q=document.getElementById("searchInput").value.toLowerCase();let f=animes.filter(a=>a.title.toLowerCase().includes(q));render(f);}
function rateAnime(id,n){let box=document.getElementById('rate-'+id);box.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',i<n);});}
function addComment(id,input){if(!input.value.trim())return;document.getElementById('c-'+id).innerHTML+=`<div>${input.value}</div>`;input.value="";}
function submitRequest(){let n=document.getElementById("reqName").value;let l=document.getElementById("reqLang").value;if(!n)return alert("Anime ka naam likho");document.getElementById("reqMsg").innerText=`Request Saved: ${n} - ${l} ✅ Hum jald add karenge!`;document.getElementById("reqName").value="";document.getElementById("reqLang").value="";}
render(animes);
</script>
