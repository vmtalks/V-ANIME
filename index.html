<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Trailers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0b0b10;color:#fff;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h1 span{color:#ff3b5c}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){#grid{grid-template-columns:repeat(5,1fr)}}
.card{background:#15151d;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #262633}
.poster{position:relative;aspect-ratio:16/9;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play b{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff}
.info{padding:10px 10px 12px}
.info h3{font-size:13px;line-height:1.3;min-height:34px}
.season-bar{display:flex;gap:4px;margin:8px 0 4px}
.season-bar i{flex:1;height:6px;border-radius:99px;background:#2a2a38;display:block}
.season-bar i.on{background:#ff3b5c}
.season-label{font-size:11px;color:#aaa}
.season-label b{color:#fff}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99;padding:12px}
#modal.open{display:flex}
.box{width:100%;max-width:900px}
.box iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.close{float:right;background:#ff3b5c;border:0;color:#fff;padding:8px 14px;border-radius:99px;margin-bottom:8px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<h1>Anime <span>Trailers</span> • 44 Ready</h1>
<div id="grid"></div>

<div id="modal"><div class="box"><button class="close" onclick="closeModal()">✕ Close</button><iframe id="player" allowfullscreen allow="autoplay; encrypted-media"></iframe></div></div>

const grid=document.getElementById('grid');
data.forEach((a,i)=>{
  let bars='';
  for(let s=1;s<=a.seasons;s++){ bars+=`<i class="${s<=a.cur?'on':''}"></i>`; }
  grid.innerHTML+=`<div class="card" onclick="openModal('${a.id}')">
    <div class="poster"><img src="https://i.ytimg.com/vi/${a.id}/hqdefault.jpg" loading="lazy"><div class="play"><b>▶</b></div></div>
    <div class="info"><h3>${i+1}. ${a.t}</h3><div class="season-bar">${bars}</div><div class="season-label">Season <b>${a.cur}</b> / ${a.seasons} Seasons • Trailer</div></div>
  </div>`;
});
function openModal(id){
  document.getElementById('player').src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('player').src='';
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
