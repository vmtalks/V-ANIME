<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-ANIME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0f;color:#fff}
header{position:sticky;top:0;z-index:99;background:#0a0a0f;padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
/* LOGO - AB LINK PE NAHI, ANDAR HI BANA HAI, HAMESHA DIKHEGA */
.logo-box{width:48px;height:48px;min-width:48px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6d28d9);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;border:2px solid #a855f7;box-shadow:0 0 15px #a855f7}
.hero-logo-box{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6d28d9);display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:900;color:#fff;border:3px solid #a855f7;box-shadow:0 0 35px #a855f7;margin:0 auto}
.logo-text{font-size:26px;font-weight:900}.logo-text span{color:#a855f7}
#searchInput{flex:1;padding:10px 14px;border-radius:20px;border:none;background:#1e1e26;color:#fff;outline:none;margin-left:10px}
.hero{text-align:center;padding:20px 14px 6px}
.hero h1{font-size:34px;margin-top:14px}.hero h1 span{color:#a855f7}
.hero p{color:#aaa;margin-top:8px;font-size:14px}
.trending{padding:14px}.trending h2{font-size:24px;margin-bottom:12px}
#animeList{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151d;border-radius:16px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:220px;object-fit:cover;display:block;background:#222}
.card-body{padding:12px}.card-body h3{font-size:16px;line-height:1.2}
.card-body p{font-size:12px;color:#aaa;margin:5px 0 10px}
.watch-btn{width:100%;padding:10px;background:#a855f7;color:#fff;border:none;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer}
/* ALAG PAGE */
#detailPage{display:none;padding:12px}
.back-btn{display:inline-block;background:#222;color:#fff;padding:9px 16px;border-radius:20px;border:none;font-size:14px;cursor:pointer}
.detail-top{display:flex;gap:14px;margin:14px 0;align-items:center}
.detail-top .d-poster{width:120px;height:170px;border-radius:12px;background:#222;display:flex;align-items:center;justify-content:center;font-size:14px;text-align:center;padding:8px;color:#aaa}
.detail-top h2{font-size:22px;line-height:1.2}.detail-top p{color:#a855f7;font-size:13px;margin:6px 0}
.player{margin:10px 0;border-radius:12px;overflow:hidden;background:#000}
.player iframe{width:100%;height:230px;border:none;display:block}
.player-msg{padding:12px;text-align:center;font-size:12px;color:#aaa}
.now-playing{background:#1e1e1e;padding:10px;border-radius:10px;font-size:14px;margin-bottom:10px;display:none}
.now-playing b{color:#a855f7}
.ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ep-grid button{padding:11px 0;background:#2a2a2a;border:1px solid #333;color:#fff;border-radius:8px;font-size:13px}
.ep-grid button.active{border:2px solid #a855f7 !important;background:#a855f7}
.direct-box{background:#222;padding:12px;border-radius:10px;font-size:13px;line-height:1.6;margin:10px 0}
.direct-box a{display:block;text-align:center;background:#a855f7;color:#fff;padding:11px;border-radius:8px;text-decoration:none;font-weight:700;margin:8px 0}
.req{margin:14px;background:#15151d;padding:12px;border-radius:12px;border:1px solid #333}
.req input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#0a0a0f;color:#fff}
.req button{width:100%;padding:11px;background:#a855f7;color:#fff;border:none;border-radius:8px;font-weight:700}
.footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><div class="logo-box">V</div><div class="logo-text">V-<span>ANIME</span></div><input id="searchInput" placeholder="Search anime..." oninput="searchAnime()"></header>

<!-- HOME PAGE -->
<div id="homePage">
<div class="hero"><div class="hero-logo-box">V</div><h1>Watch <span>Anime</span> Free</h1><p>Best Anime Collection - Hindi
