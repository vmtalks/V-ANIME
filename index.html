<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-ANIME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0f;color:white;padding-bottom:80px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#111118;position:sticky;top:0;z-index:20}
.logo-box{display:flex;align-items:center;gap:8px}
.logo-box img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #a855f7;box-shadow:0 0 12px #a855f7}
.logo-box h1{font-size:20px}.logo-box h1 span{color:#a855f7}
#search{padding:9px 12px;border-radius:20px;border:none;background:#22222e;color:white;width:140px;outline:none}
.hero{text-align:center;padding:22px 12px}
.hero img{width:85px;height:85px;border-radius:50%;object-fit:cover;border:3px solid #a855f7;box-shadow:0 0 20px #a855f7}
.hero h2{margin-top:10px;font-size:24px}.hero h2 span{color:#a855f7}.hero p{color:#aaa;font-size:13px;margin-top:4px}
.cat{display:flex;gap:8px;padding:0 14px;overflow-x:auto}
.cat button{background:#22222e;color:white;border:none;padding:8px 14px;border-radius:20px;white-space:nowrap}
.cat button.active{background:#a855f7}
.section{padding:14px}
.section h3{margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a24;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:190px;object-fit:cover;background:#2a2a35}
.card h4{padding:8px 10px 2px;font-size:14px}
.card p{padding:0 10px 10px;color:#aaa;font-size:11px}
/* Detail Page */
#detail{display:none;position:fixed;inset:0;background:#0a0a0f;z-index:50;overflow-y:auto;padding-bottom:30px}
#detail .top{position:relative}
#detail .top img{width:100%;height:300px;object-fit:cover}
#detail .back{position:absolute;top:12px;left:12px;background:black;padding:8px 14px;border-radius:20px;border:none;color:white;font-size:16px}
#detail .info{padding:14px}
#detail h2{font-size:22px}
#detail .tag{color:#a855f7;font-size:13px;margin:5px 0}
#detail p{color:#ccc;font-size:14px;line-height:20px}
.ep{margin-top:14px}
.ep button{display:flex;justify-content:space-between;width:100%;background:#1a1a24;color:white;border:none;padding:13px;border-radius:10px;margin-bottom:8px;text-align:left}
.ep button span:last-child{background:#a855f7;padding:4px 10px;border-radius:20px;font-size:12px}
/* Player */
#player{display:none;position:fixed;inset:0;background:black;z-index:100;padding:14px}
#player video{width:100%;margin-top:60px;border-radius:10px}
#player button{background:#a855f7;color:white;border:none;padding:10px 18px;border-radius:20px;margin-top:15px}
.wm{position:fixed;bottom:10px;right:10px;opacity:.15;width:70px;height:70px;border-radius:50%;pointer-events:none}
footer{text-align:center;color:#666;font-size:12px;padding:20px}
</style>
</head>
<body>

<header>
<div class="logo-box"><img src="IMG-20261106-WA6885.jpg"><h1>V-<span>ANIME</span></h1></div>
<input id="search" placeholder="Search anime..." oninput="doSearch()">
</header>

<div class="hero">
<img src="IMG-20261106-WA6885.jpg">
<h2>Watch <span>Anime</span> Free</h2>
<p>50 Best Anime - Hindi & English</p>
</div>

<div class="cat" id="cats">
<button class="active" onclick="filterCat('All',this)">All (50)</button>
<button onclick="filterCat('Action',this)">Action</button>
<button onclick="filterCat('Comedy',this)">Comedy</button>
<button onclick="filterCat('Romance',this)">Romance</button>
<button onclick="filterCat('Adventure',this)">Adventure</button>
</div>

<div class="section"><h3 id="title">🔥 All Anime (50)</h3><div class="grid" id="grid"></div></div>
<footer>V-ANIME © 2026</footer>
<img class="wm" src="IMG-20261106-WA6885.jpg">

<!-- DETAIL PAGE -->
<div id="detail">
<div class="top"><img id="dImg"><button class="back" onclick="closeDetail()">← Back</button></div>
<div class="info"><h2 id="dTitle"></h2><div class="tag" id="dTag"></div><p id="dDesc"></p><h3 style="margin-top:15px">Episodes</h3><div class="ep" id="epList"></div></div>
</div>

<!-- PLAYER -->
<div id="player">
<h2 id="pTitle" style="margin-top:20px"></h2>
<video id="vid" controls autoplay src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
<p style="color:#aaa;margin-top:10px;font-size:13px">Demo video hai. Apna video link lagane ke liye bata dena, main laga dunga.</p>
<button onclick="closePlayer()">← Back to Episodes</button>
</div>

<script>
let animes = [
["Solo Leveling","Action","https://cdn.myanimelist.net/images/anime/1440/139000.jpg"],
["Jujutsu Kaisen","Action","https://cdn.myanimelist.net/images/anime/1792/138022.jpg"],
["Demon Slayer","Action","https://cdn.myanimelist.net/images/anime/1286/99889.jpg"],
["One Piece","Adventure","https://cdn.myanimelist.net/images/anime/6/73245.jpg"],
["Naruto","Action","https://cdn.myanimelist.net/images/anime/13/17405.jpg"],
["Attack on Titan","Action","https://cdn.myanimelist.net/images/anime/10/47347.jpg"],
["Chainsaw Man","Action","https://cdn.myanimelist.net/images/anime/1013/142670.jpg"],
["Spy x Family","Comedy","https://cdn.myanimelist.net/images/anime/1160/138058.jpg"],
["Death Note","Action","https://cdn.myanimelist.net/images/anime/9/9453.jpg"],
["Dragon Ball Z","Action","https://cdn.myanimelist.net/images/anime/6/20936.jpg"],
["My Hero Academia","Action","https://cdn.myanimelist.net/images/anime/10/78745.jpg"],
["One Punch Man","Comedy","https://cdn.myanimelist.net/images/anime/12/76049.jpg"],
["Tokyo Ghoul","Action","https://cdn.myanimelist.net/images/anime/1498/134443.jpg"],
["Hunter x Hunter","Adventure","https://cdn.myanimelist.net/images/anime/1337/99013.jpg"],
["Fullmetal Alchemist","Action","https://cdn.myanimelist.net/images/anime/1223/96541.jpg"],
["Bleach","Action","https://cdn.myanimelist.net/images/anime/3/40451.jpg"],
["Black Clover","Action","https://cdn.myanimelist.net/images/anime/2/88336.jpg"],
["Fire Force","Action","https://cdn.myanimelist.net/images/anime/1151/113961.jpg"],
["Vinland Saga","Action","https://cdn.myanimelist.net/images/anime/1500/103005.jpg"],
["Mob Psycho 100","Comedy","https://cdn.myanimelist.net/images/anime/8/80356.jpg"],
["Your Name","Romance","https://cdn.myanimelist.net/images/anime/5/87048.jpg"],
["Weathering With You","Romance","https://cdn.myanimelist.net/images/anime/8/102039.jpg"],
["A Silent Voice","Romance","https://cdn.myanimelist.net/images/anime/7/86897.jpg"],
["Horimiya","Romance","https://cdn.myanimelist.net/images/anime/1695/111486.jpg"],
["Toradora","Romance","https://cdn.myanimelist.net/images/anime/17/17847.jpg"],
["Kaguya-sama","Comedy","https://cdn.myanimelist.net/images/anime/1295/106551.jpg"],
["Konosuba","Comedy","https://cdn.myanimelist.net/images/anime/1377/101463.jpg"],
["Re:Zero","Adventure","https://cdn.myanimelist.net/images/anime/1522/128039.jpg"],
["Sword Art Online","Adventure","https://cdn.myanimelist.net/images/anime/11/39717.jpg"],
["Fairy Tail","Adventure","https://cdn.myanimelist.net/images/anime/5/18179.jpg"],
["Seven Deadly Sins","Adventure","https://cdn.myanimelist.net/images/anime/8/65409.jpg"],
["Boruto","Action","https://cdn.myanimelist.net/images/anime/5/87045.jpg"],
["Dr. Stone","Adventure","https://cdn.myanimelist.net/images/anime/4/101921.jpg"],
["JoJo's Bizarre","Action","https://cdn.myanimelist.net/images/anime/3/40451.jpg"],
["Haikyuu","Comedy","https://cdn.myanimelist.net/images/anime/7/76014.jpg"],
["Doraemon","Comedy","https://cdn.myanimelist.net/images/anime/9/12345.jpg"],
["Shinchan","Comedy","https://cdn.myanimelist.net/images/anime/4/56789.jpg"],
["Pokemon","Adventure","https://cdn.myanimelist.net/images/anime/7/12345.jpg"],
["Digimon","Adventure","https://cdn.myanimelist.net/images/anime/9/23456.jpg"],
["Beyblade","Action","https://cdn.myanimelist.net/images/anime/1/34567.jpg"],
["Kaiju No.8","Action","https://cdn.myanimelist.net/images/anime/1177/141283.jpg"],
["Frieren","Adventure","https://cdn.myanimelist.net/images/anime/1015/138006.jpg"],
["Mashle","Comedy","https://cdn.myanimelist.net/images/anime/1427/135828.jpg"],
["Blue Lock","Action","https://cdn.myanimelist.net/images/anime/1164/138057.jpg"],
["Oshi No Ko","Romance","https://cdn.myanimelist.net/images/anime/1812/134736.jpg"],
["Apothecary Diaries","Romance","https://cdn.myanimelist.net/images/anime/1011/141393.jpg"],
["Dan Da Dan","Comedy","https://cdn.myanimelist.net/images/anime/1419/142677.jpg"],
["Sakamoto Days","Comedy","https://cdn.myanimelist.net/images/anime/1510/143047.jpg"],
["Wind Breaker","Action","https://cdn.myanimelist.net/images/anime/1027/143050.jpg"],
["Lookism","Action","https://cdn.myanimelist.net/images/anime/1147/141476.jpg"]
];
let currentCat='All';
function show(list){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((a,i)=>{
let div=document.createElement('div');div.className='card';
div.innerHTML=`<img src="${a[2]}" onerror="this.src='https://via.placeholder.com/300x400/7c3aed/ffffff?text=${encodeURIComponent(a[0])}'"><h4>${a[0]}</h4><p>${a[1]} • Hindi Dub</p>`;
div.onclick=()=>openDetail(i);
g.appendChild(div);
});
document.getElementById('title').innerText='🔥 '+ (currentCat=='All'?'All Anime':currentCat) +' ('+list.length+')';
}
function doSearch(){
let q=document.getElementById('search').value.toLowerCase();
let f=animes.filter(a=>a[0].toLowerCase().includes(q));
if(currentCat!='All') f=f.filter(a=>a[1]==currentCat);
show(f);
}
function filterCat(c,btn){
currentCat=c;
document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');doSearch();
}
function openDetail(i){
let a=animes[i];
document.getElementById('dImg').src=a[2];
document.getElementById('dImg').onerror=function(){this.src='https://via.placeholder.com/600x300/7c3aed/ffffff?text='+encodeURIComponent(a[0])};
document.getElementById('dTitle').innerText=a[0];
document.getElementById('dTag').innerText=a[1]+' • Hindi Dub • HD';
document.getElementById('dDesc').innerText=a[0]+' ka full season Hindi me dekho. Neeche kisi bhi episode pe tap karo, video turant play hoga.';
let ep=document.getElementById('epList');ep.innerHTML='';
for(let e=1;e<=12;e++){
let b=document.createElement('button');
b.innerHTML=`<span>Episode ${e} - ${a[0]}</span><span>▶ Play</span>`;
b.onclick=()=>playEp(a[0],e);
ep.appendChild(b);
}
document.getElementById('detail').style.display='block';window.scrollTo(0,0);
}
function closeDetail(){document.getElementById('detail').style.display='none'}
function playEp(name,ep){
document.getElementById('pTitle').innerText=name+' - Episode '+ep;
document.getElementById('player').style.display='block';
let v=document.getElementById('vid');v.play();
}
function closePlayer(){document.getElementById('vid').pause();document.getElementById('player').style.display='none'}
show(animes);
</script>
</body>
</html>
