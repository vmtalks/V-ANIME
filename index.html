*{margin:0;padding:0;box-sizing:border-box}

.section{font-size:24px;font-weight:800;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#1e1e28;border-radius:16px;overflow:hidden;cursor:pointer}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99;padding:12px}
#modal.open{display:flex}
.box{width:100%;max-width:900px}
.box iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.close{float:right;background:#a855f7;border:0;color:#fff;padding:8px 14px;border-radius:99px;margin-bottom:8px;cursor:pointer;font-weight:700}
