<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Playlist Checker - V-ANIME</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0f;color:#fff;padding:14px}h1{font-size:22px}h1 span{color:#a855f7}textarea{width:100%;height:180px;background:#22222e;color:#fff;border:none;border-radius:12px;padding:12px;margin:12px 0;outline:none}button{width:100%;background:#a855f7;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:bold;font-size:16px}.card{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:12px;margin-top:10px;display:flex;gap:10px}.card img{width:90px;height:60px;object-fit:cover;border-radius:8px}.card b{font-size:14px;display:block}.card span{font-size:12px}.hindi{color:#4ade80}.jap{color:#f87171}.eng{color:#facc15}</style></head><body>
<h1>V-<span>ANIME</span> Playlist Checker</h1>
<p style="color:#aaa;font-size:13px;margin-top:6px">Apne 55 Playlist Link yahan paste karo, CHECK dabao - khud naam + Hindi / Japanese batayega!</p>
<textarea id="in" placeholder="https://youtube.com/playlist?list=PL...&#10;https://youtube.com/playlist?list=PL..."></textarea>
<button onclick="check()">🔍 CHECK KARO - Kon Hindi, Kon Japanese</button>
<div id="out"></div>
<script>
async function check(){
let txt=document.getElementById("in").value.trim().split("\n");
let out=document.getElementById("out"); out.innerHTML="<p style='margin-top:12px'>Checking... thoda wait karo...</p>";
out.innerHTML="";
for(let line of txt){
let m=line.match(/list=([^& ]+)/); if(!m) continue;
let pl=m[1];
try{
let r=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent("https://www.youtube.com/playlist?list="+pl));
let j=await r.json();
let title=j.title||"Unknown";
let lang="Unknown";
if(title.toLowerCase().includes("hindi")) lang="HINDI DUB ✅";
else if(title.toLowerCase().includes("japanese")||title.toLowerCase().includes("japan")) lang="JAPANESE ❌ - Hata do";
else if(title.toLowerCase().includes("english")||title.toLowerCase().includes("eng sub")) lang="ENGLISH SUB ⚠️";
else lang="Check Karo - Title me language nahi likha";
let cls=lang.includes("HINDI")?"hindi":lang.includes("JAPANESE")?"jap":"eng";
out.innerHTML+=`<div class="card"><img src="${j.thumbnail_url}"><div><b>${title}</b><span>Channel: ${j.author_name}</span><br><span class="${cls}"><b>${lang}</b></span><br><span style="color:#666">${pl}</span></div></div>`;
}catch(e){
out.innerHTML+=`<div class="card"><div><b>❌ Nahi khula - ${pl}</b><span>Ye Playlist private hai ya YouTube ne block kiya. Isko site me mat daalo.</span></div></div>`;
}
}
}
</script></body></html>
