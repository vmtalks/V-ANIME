.secTitle{font-size:18px;font-weight:bold;margin:14px 0 4px}
.secTitle span{color:#a855f7}
.epGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.epBtn{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;color:#fff}
.epBtn.active{background:#a855f7;border-color:#a855f7}
.epBtn b{display:block;font-size:20px;line-height:1}
.epBtn small{font-size:11px;color:#aaa}
.epBtn.active small{color:#fff}
